<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>G11 Connected · Versão demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14264F;--blue:#0B4FA8;--gold:#B88849;--ink:#4A5875;--bg:#F6F3EC;--line:#E3DDD0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--navy);font-family:Manrope,system-ui,sans-serif;display:flex;flex-direction:column}
.strip{background:#8A5A1E;color:#fff;font-weight:700;font-size:12px;line-height:26px;letter-spacing:.06em;text-align:center;text-transform:uppercase}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px 28px;box-shadow:0 10px 30px rgba(20,38,79,.06)}
.brand{font-family:Fraunces,Georgia,serif;font-size:22px;letter-spacing:.02em}
.brand b{font-weight:600}.brand i{font-style:normal;font-family:Manrope,sans-serif;font-size:11px;letter-spacing:.28em;margin-left:8px;color:var(--gold);font-weight:700}
h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:34px;line-height:1.1;margin:22px 0 10px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;background:#F1E6D3;color:#8A5A1E}
p{color:var(--ink);font-size:15px;line-height:1.55;margin:12px 0 0}
label{display:block;font-weight:700;font-size:13px;margin:24px 0 8px}
input{width:100%;font:inherit;font-size:18px;letter-spacing:.08em;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--navy)}
input:focus{outline:3px solid rgba(11,79,168,.25);border-color:var(--blue)}
button{margin-top:18px;width:100%;min-height:50px;font:inherit;font-weight:700;font-size:16px;border:0;border-radius:14px;background:var(--navy);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
#err{min-height:20px;margin:10px 0 0;font-size:14px;color:#C23B3B}
footer{padding:16px;text-align:center;font-size:12px;color:var(--ink)}
</style>
</head>
<body>
<div class="strip">Em desenvolvimento · Versão demo</div>
<main>
  <form class="card" id="f" autocomplete="off">
    <div class="brand"><b>G11</b><i>CONNECTED</i></div>
    <h1>Acesso reservado</h1>
    <span class="pill">Em desenvolvimento · Versão demo</span>
    <p>Esta é uma demonstração interna. Para entrar, escreve a palavra-passe da demo.</p>
    <label for="pw">Palavra-passe da demo</label>
    <input id="pw" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX" required>
    <p id="err" role="alert"></p>
    <button id="go" type="submit">Entrar</button>
  </form>
</main>
<footer>Gateleven · Formação &amp; Desenvolvimento</footer>
<script>
(() => {
  const ITER = 210000;
  const norm = s => s.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const $ = s => document.querySelector(s);
  const err = m => { $('#err').textContent = m; };
  async function derive(pass, salt) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(pass)), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  }
  const get = async u => new Uint8Array(await (await fetch(u, {cache: 'no-store'})).arrayBuffer());
  $('#f').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#go'); btn.disabled = true; err('');
    try {
      if (!window.isSecureContext || !crypto.subtle) throw new Error('Abre esta página por https.');
      const buf = await get('app.bin');
      const key = await derive($('#pw').value, buf.slice(0, 16));
      let payload;
      try {
        payload = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: buf.slice(16, 28)}, key, buf.slice(28))));
      } catch (x) { btn.disabled = false; return err('Palavra-passe incorreta.'); }
      btn.textContent = 'A abrir…';
      const urls = {};
      await Promise.all(Object.entries(payload.assets).map(async ([p, a]) => {
        const b = await get(a.f);
        const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b.slice(0, 12)}, key, b.slice(12));
        urls[p] = URL.createObjectURL(new Blob([pt], {type: a.t}));
      }));
      const inject = '<script>window.__COFRE=' + JSON.stringify(payload.cofre).replace(/</g, '\\u003c') + ';window.__ASSETS=' + JSON.stringify(urls) + ';<\/script>';
      const html = payload.html.replace('<head>', () => '<head>' + inject);
      document.open(); document.write(html); document.close();
    } catch (x) {
      btn.disabled = false; btn.textContent = 'Entrar';
      err(x && x.message && x.message.indexOf('https') > -1 ? x.message : 'Não foi possível abrir. Tenta outra vez.');
    }
  });
})();
</script>
</body>
</html>
